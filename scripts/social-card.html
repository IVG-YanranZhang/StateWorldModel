<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Manrope;
        src: url("{{FONT_URL}}") format("woff2");
        font-weight: 200 800;
        font-display: block;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #f5f4ed;
        color: #24372f;
        font-family: Manrope, Arial, sans-serif;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        right: -16px;
        top: 50px;
        width: 735px;
        height: 535px;
        object-fit: contain;
      }
      .shade {
        display: none;
      }
      .content {
        position: absolute;
        inset: 48px 54px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .status {
        font-size: 14px;
        font-weight: 550;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: #58705f;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .status:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #58705f;
      }
      h1 {
        font-size: 88px;
        font-weight: 650;
        line-height: 1;
        letter-spacing: -0.065em;
        margin: 48px 0 24px;
      }
      .subtitle {
        font-family: Georgia, serif;
        font-size: 36px;
        line-height: 1.25;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .subtitle em {
        color: #3e7762;
      }
      .footer {
        margin-top: auto;
        font-size: 16px;
        letter-spacing: 0.025em;
        color: #607265;
      }
    </style>
  </head>
  <body>
    <img
      class="scene"
      src="{{SCENE_IMAGE}}"
      alt="Conceptual illustration of state and rules supporting a generated world"
    />
    <div class="shade"></div>
    <div class="content">
      <div class="status">State World Models / Research project</div>
      <h1>State World<br />Models</h1>
      <p class="subtitle">
        Execute the Rules,<br /><em>Generate the Pixels.</em>
      </p>
      <p class="footer">Stateful Harness · WorldState-Bench</p>
    </div>
  </body>
</html>
